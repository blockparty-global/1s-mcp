startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      onesourceBaseUrl:
        type: string
        default: "https://skills.onesource.io"
        description: "OneSource API base URL"
      analytics:
        type: boolean
        default: true
        description: "Enable usage analytics"
      x402PrivateKey:
        type: string
        description: "EVM private key (hex, 0x-prefixed) for automatic x402 USDC payments on Base"
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@one-source/mcp'],
      env: {
        ONESOURCE_BASE_URL: config.onesourceBaseUrl || 'https://skills.onesource.io',
        ONESOURCE_ANALYTICS: config.analytics === false ? 'false' : 'true',
        ...(config.x402PrivateKey ? { X402_PRIVATE_KEY: config.x402PrivateKey } : {})
      }
    })
